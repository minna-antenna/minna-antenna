<!-- 再開レビュー用。公開成果物には含めない。見出しデータは含まない。 -->
<section id="news" class="card" aria-labelledby="realNewsHeading"><div class="cardhead realnews-title"><h2 id="realNewsHeading">📰 外部ニュース（RSS） <small id="newsUpdated">自動更新</small></h2><small>外部サイトの記事へ移動します ↗</small></div><div class="realfilters" id="realFilters" aria-label="ニュースのジャンル"></div><div class="searchrow"><input id="newsSearch" type="search" placeholder="ニュースの見出しを検索" aria-label="ニュースの見出しを検索"><button id="clearSearch" type="button">クリア</button></div><div id="realNewsRows" aria-live="polite"></div><noscript><p class="content">ニュース一覧にはJavaScriptが必要です。独自解説記事はそのままお読みいただけます。</p></noscript><div class="realnews-note">この欄は外部記事へのリンク集です。RSSで提供された見出し・出典・公開日時を表示し、本文・画像は複製していません。独自解説記事とは別の情報です。</div></section>
<script>
/* Existing RSS rendering and source-evidence module retained from the working site. */

(()=>{'use strict';
const root=document.getElementById('realNewsRows'), filters=document.getElementById('realFilters');
const heading=document.getElementById('realNewsHeading');
const note=document.querySelector('.realnews-note');
let items=[], selected='すべて',payload=null;
heading.innerHTML='📰 外部ニュース（RSS） <small id="newsUpdated">自動更新・未取得</small>';
const toolbar=document.createElement('div'); toolbar.className='proofbar';
const refresh=document.createElement('button'); refresh.textContent='↻ 最新の取得データを確認';
const policy=document.createElement('button');policy.textContent='選定ルール・取得元を確認';
const status=document.createElement('span');status.setAttribute('role','status');status.textContent='ニュースデータを読み込み中…';
toolbar.append(refresh,policy,status);document.querySelector('.realnews-title').after(toolbar);
const dialog=document.createElement('dialog');dialog.className='rss-proof';document.body.append(dialog);
function close(){dialog.close()}
function showDialog(title,content){dialog.replaceChildren();let h=document.createElement('h3');h.textContent=title;dialog.append(h,content);let b=document.createElement('button');b.textContent='閉じる';b.onclick=close;dialog.append(b);dialog.showModal()}
function paragraph(t){const p=document.createElement('p');p.textContent=t;return p}
function fmt(d){if(!d)return '未取得';const date=new Date(d);return Number.isNaN(date.getTime())?'不明':date.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+' JST'}
function proof(x){let c=document.createElement('div');const r=x.reason||{};const current=x.scoring_version===2;
const lines=current?[
 '並び順の計算：'+r.scoring_rule,
 '並び順スコア：'+x.score+'点（新しさ '+r.freshness_points+'点／識別済み発行主体の見出し一致 '+r.additional_publisher_points+'点）',
 '識別済みの発行主体：'+((r.publishers||[]).map(p=>p.name).join('、')||'なし（加点対象外）'),
 '同じ見出しを取得したフィード：'+(r.feed_names||[x.feed]).join('、'),
 '識別設定が未登録の発行元名：'+((r.unidentified_source_names||[]).join('、')||'なし')
]:['旧方式で保存されたデータです。取得失敗等で保持しているため、現在の採点根拠としては扱いません。次回の正常取得で再計算します。'];
lines.push('公開日時：'+fmt(x.published_at),'掲載データ更新：'+fmt(payload?.generated_at),
 '発行主体：'+(x.publisher||x.source)+(x.publisher_id?'':'（識別未確認）'),
 '取得フィード：'+x.feed,'配信経路：'+(x.provider||'旧データのため不明'),
 '見出しは記号・空白の違いを除いて比較しています。同じ事件でも異なる見出しはまとめません。複数の発行主体に掲載されていても、内容の正しさや独立した取材を確認したことを意味しません。');
lines.forEach(t=>c.append(paragraph(t)));let link=document.createElement('a');link.textContent='元の記事を開く ↗';link.href=x.url;link.target='_blank';link.rel='noopener noreferrer';c.append(link);showDialog('取得と並び順の根拠',c)}

function render(){const cats=['すべて',...new Set(items.map(x=>x.category))];filters.replaceChildren(...cats.map(cat=>{let b=document.createElement('button');b.textContent=cat;b.className=selected===cat?'on':'';b.setAttribute('aria-pressed',String(selected===cat));b.onclick=()=>{selected=cat;render()};return b}));root.replaceChildren();const found=items.filter(x=>selected==='すべて'||x.category===selected);
if(!found.length){root.append(paragraph(payload?.status==='not_started'?'最初のRSS更新がまだ実行されていません。READMEの初期設定をご確認ください。':'現在表示できるニュースがありません。更新状態を確認してください。'));return}
found.forEach(x=>{let row=document.createElement('div');row.className='real-row';let date=document.createElement('span');date.className='real-date';date.textContent=fmt(x.published_at).slice(5,16);let a=document.createElement('a');a.className='real-headline';a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=x.title;let cat=document.createElement('span');cat.className='real-cat';cat.textContent=x.category;let src=document.createElement('span');src.className='real-source';src.textContent=(x.publisher||x.source)+(x.publisher_id?'':'（識別未確認）');let why=document.createElement('button');why.className='reasonbtn';why.textContent=(x.scoring_version===2?'並び順 ':'旧方式 ')+x.score+'点';why.onclick=()=>proof(x);row.append(date,a,cat,src,why);root.append(row)})}
policy.onclick=()=>{let c=document.createElement('div');c.append(paragraph(payload?.method||'RSSの更新をまだ実行していません。'));c.append(paragraph('掲載順：72時間以内のRSS項目を対象に、新しさと、同一見出しを掲載した識別済み発行主体数で計算します。同一主体の複数フィードは重複加点しません。未識別の発行元は加点対象外です。ジャンルごと最大10件、全体最大60件。事実確認・人気順位を示すものではありません。'));c.append(paragraph('正常取得：'+(payload?.feed_success||[]).length+'フィード／エラー：'+(payload?.feed_errors||[]).length+'フィード'));(payload?.feed_success||[]).forEach(f=>{let p=paragraph(f.name+'（配信経路 '+(f.provider||'旧データ')+'）：'+f.count+'件 ／ '+f.url);c.append(p)});(payload?.feed_errors||[]).forEach(e=>c.append(paragraph('取得失敗：'+e.feed+'：'+e.error)));showDialog('更新根拠と取得元',c)};
async function load(){status.textContent='データ取得中…';try{let res=await fetch('./data/news.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);payload=await res.json();if(!Array.isArray(payload.articles))throw new Error('ニュースデータの形式が不正です');items=payload.articles.filter(x=>x&&typeof x.title==='string'&&/^https?:\/\//i.test(x.url));if(selected!=='すべて'&&!items.some(x=>x.category===selected))selected='すべて';document.getElementById('newsUpdated').textContent='最終成功取得：'+fmt(payload.generated_at);status.textContent='表示 '+items.length+'件 ／ '+(payload.status==='ok'?'正常':payload.status==='partial'?'一部取得失敗':payload.status==='error'?'取得失敗・過去データ':'未実行');note.textContent='RSSを3時間ごとに更新する設定です（GitHub Actionsを有効化・GitHub Pages等に公開した場合）。PV・SNS拡散数は測定していません。各項目の「並び順」で計算内訳を表示できます。RSS見出しの表示であり、独自解説とは別です。';render()}catch(e){if(!items.length)root.replaceChildren(paragraph('ニュースを取得できませんでした。時間をおいて更新ボタンで再試行してください。独自解説記事は引き続き閲覧できます。'));status.textContent='読み込み失敗：'+e.message;}}
refresh.onclick=load;load();
})();

</script>
<script>
(()=>{'use strict';const input=document.getElementById('newsSearch');const clear=document.getElementById('clearSearch');const root=document.getElementById('realNewsRows');if(!input||!root)return;let q='';function apply(){root.querySelectorAll('.real-row').forEach(row=>{row.hidden=!!q&&!row.textContent.toLocaleLowerCase('ja').includes(q)})}input.addEventListener('input',()=>{q=input.value.trim().toLocaleLowerCase('ja');apply()});clear.addEventListener('click',()=>{input.value='';q='';apply();input.focus()});const observer=new MutationObserver(()=>apply());observer.observe(root,{childList:true});})();
</script>
