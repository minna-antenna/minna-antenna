:root{--slate:#4a5969;--line:#d9dfe4;--ink:#20334a;--cyan:#70cbd0;--link:#1b4d77}*{box-sizing:border-box}body{margin:0;background-color:#f8f8f5;background-image:linear-gradient(45deg,#e9efec 25%,transparent 25%,transparent 75%,#e9efec 75%,#e9efec),linear-gradient(45deg,#e9efec 25%,transparent 25%,transparent 75%,#e9efec 75%,#e9efec);background-position:0 0,18px 18px;background-size:36px 36px;font-family:Arial,'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;color:var(--ink);font-size:13px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #16a9d5;outline-offset:2px}a{color:var(--link)}.container{max-width:1140px;margin:auto;padding:0 16px 60px}.mast{background:#344e51;color:white;border-bottom:3px solid #8bc6a9;margin-bottom:18px}.mastinner{max-width:1140px;margin:auto;padding:15px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}.brand{font-size:25px;font-weight:900;letter-spacing:.02em}.brand small{font-size:11px;font-weight:400;display:block;color:#cfdae2}.mast .grow{flex:1}.toplinks{display:flex;gap:7px;flex-wrap:wrap}.toplinks button,.smallbtn,.pages button{border:1px solid #d6dce2;background:#fff;color:#2d658b;border-radius:2px;padding:6px 10px;font-size:12px}.toplinks button{background:#415768;color:#fff;border-color:#748694}.toplinks button.active{background:#e7f6f7;color:#234a60}.searchbar{display:flex;gap:8px;margin-bottom:16px}.searchbar input{padding:9px 11px;border:1px solid #cfd7db;flex:1;min-width:0;background:white}.searchbar button,.primary{background:#3e738e;color:white;border:0;padding:9px 15px;font-weight:700}.panel{border:1px solid #cbd7d2;background:#fff;margin-bottom:16px;border-radius:5px;overflow:hidden;box-shadow:0 2px 8px rgba(48,77,73,.045)}.panelhead{min-height:34px;background:#4c6263;color:white;padding:7px 10px;display:flex;align-items:center;gap:8px;font-weight:700}.panelhead .right{margin-left:auto;displ center;gap:12px}.dialoghead strong{flex:1;font-size:15px}.dialoghead button{background:#fff;border:0;font-size:18px;width:30px;height:30px}.dialogbody{padding:20px}.muted{color:#768697;font-size:12px}.detailtitle{font-size:20px;line-height:1.5;margin:9px 0 14px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.controls button{border:1px solid #d3dce2;background:#f5f7f8;padding:7px 12px;color:#315471}.comments{border-top:1px solid #d7e0e5;margin-top:20px}.comment{border-bottom:1px solid #e6ebee;padding:11px 0;white-space:pre-wrap;overflow-wrap:anywhere}.comment b{color:#297384;font-size:12px}.comment p{margin:6px 0}.field{display:block;font-weight:700;margin:12px 0 5px}.dialog input,.dialog select,.dialog textarea{width:100%;border:1px solid #cdd8df;padding:10px;background:white}.dialog textarea{min-height:90px;resize:vertical}.notice{background:#eff8f9;border-left:3px solid #61c4cb;padding:9px 12px;margin-bottom:12px;color:#42606b}.hidden{display:none!important}@media(max-width:700px){.container{padding:0 10px 40px}.sections{grid-template-columns:1fr}.brand{font-size:21px}.mastinner{gap:9px}.article .source{display:none}.article{gap:5px}.article .headline{font-size:12px}.article .meta{font-size:9px}.panelhead{font-size:12px}.pages button{padding:6px 8px}.toplinks{width:100%}.searchbar{margin-bottom:10px}}
</style><style>.realnews-wrap{border:1px solid #bfd4c9;background:#fff;border-radius:5px;overflow:hidden;margin-bottom:18px;box-shadow:0 3px 10px #34564b10}.realnews-title{display:flex;justify-content:space-between;align-items:center;background:#2f6159;color:white;padding:11px 13px;gap:8px;flex-wrap:wrap;font-weight:700}.realnews-title small{font-size:11px;font-weight:400;color:#e0eeea}.realfilters{display:flex;flex-wrap:wrap;gap:5px;padding:9px;background:#f5f9f6;border-bottom:1px solid #d6e4dc}.realfilters button{border:1px solid #c6dad0;background:white;color:#345c50;border-radius:3px;padding:5px 10px;font-size:12px;cursor:pointer}.realfilters button.on{background:#355f55;color:white}.real-row{display:flex;align-items:center;gap:8px;border-bottom:1px solid #e5eeea;padding:9px 10px;text-decoration:none;color:#203e4d!important;background:white}.real-row:nth-child(even){background:#f9fbfa}.real-row:hover{background:#eaf4ed}.real-row .real-date{font-size:11px;color:#74857e;min-width:74px}.real-row .real-headline{flex:1;font-weight:700;line-height:1.4}.real-row .real-cat{font-size:10px;color:#336958;background:#e4f1e9;padding:3px 5px;white-space:nowrap}.real-row .real-source{font-size:11px;color:#86928c;min-width:95px;text-align:right}.realnews-note{font-size:11px;padding:8px 11px;color:#62776d;background:#f6f9f6}@media(max-width:700px){.real-row{flex-wrap:wrap;gap:5px}.real-row .real-headline{flex-basis:calc(100% - 80px)}.real-row .real-source{margin-left:auto;min-width:auto}.real-row .real-cat{order:3}}

</style></head><body><header class="mast"><div class="mastinner"><div class="brand">⌂ トピック基地<small>話題が集まる、ニュースの発信基地。</small></div><div class="grow"></div><nav class="toplinks" aria-label="表示切り替え"><button id="navHome" class="active">新着記事</button><button id="navRank">急上昇</button><button id="navFav">★ お気に入り</button><button id="navPost">＋ スレッド作成</button></nav></div></header><main class="container"><div class="notice">下の「新着記事」一覧は架空のスレッドです。上部「注目ニュース」はRSS公開データから取得されます。投稿・コメント・お気に入りはこのブラウザに保存され、ほかの人とは共有されません。</div><section class="realnews-wrap" aria-labelledby="realNewsHeading"><div class="realnews-title"><span id="realNewsHeading">📰 注目ニュース・実記事リンク <small>自動更新</small></span><small>記事タイトルを押すと出典サイトを開きます ↗</small></div><div class="realfilters" id="realFilters"></div><div id="realNewsRows"></div><div class="realnews-note">RSSの自動取得データを表示します。各記事の根拠を確認できます。</div></section><div class="searchbar"><input id="search" type="search" placeholder="記事タイトル・ジャンルを検索" aria-label="記事を検索"><button id="searchGo">検索</button></div><section class="panel"><div class="panelhead">⌂ <span id="listTitle">新着記事</span><span class="count" id="count"></span><span class="right"><button id="sortNew" class="selected">新着順</button><button id="sortPopular">人気順にソート</button></span></div><ul id="feed" class="articles"></ul></section><nav id="pages" class="pages" aria-label="ページ切り替え"></nav><div class="sections" id="sections"></div><div class="footer">トピック基地 DEMO — 実際のニュース自動取得・ログイン・公開コメントは未接続です。<br>掲載記事はサンプルで、事実や実際の報道を示すものではありません。</div></main><div class="overlay" id="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogLabel"><div class="dialoghead"><strong id="dialogLabel">詳細</strong><button id="closeDialog" aria-label="閉じる">×</button></div><div id="dialogBody" class="dialogbody"></div></div></div><script>
(()=>{'use strict';const cats=['ニュース','アジア・翻訳','IT・家電','車・バイク','VIP','生活','パチンコ・スロット','食べ物','ファッション','アニメ','ゲーム','漫画','スポーツ','株・投資','仮想通貨','政治・経済'];const titles={ 'ニュース':['【話題】街の小さな喫茶店がSNSで注目、常連客が語る魅力','【議論】24時間営業の店舗は今後どうなる？','【生活】週末に試したい節約術を語ろう','【注目】新しい公共サービスに期待すること'], 'アジア・翻訳':['海外の人が驚いた日本の食文化について語る','【翻訳】海外掲示板で人気の日本のお土産とは？','アジア各国のおすすめ旅行先を紹介しよう','海外の人が好きな日本車は何？'], 'IT・家電':['30fpsと60fpsの違い、実際わかる？','メモリ16GBのパソコンで何ができる？','【相談】デュアルモニター環境のおすすめ','昔の携帯電話にあった便利機能を語ろう'], '車・バイク':['【画像】90年代の国産スポーツカー、今見ても格好いい','中古車の維持費ってどれぐらいかかる？','ドライブで行ってよかった場所を語ろう','純正パーツを大切に保管する方法'], 'VIP':['【雑談】最近買ってよかったものを書いていけ','子供の頃に夢中だった遊びがこちら','【朗報】休日の朝ごはん、最高の組み合わせ','なぜか何度も見てしまう動画ある？'], '生活':['一人暮らしの便利アイテムを教えて','掃除って週に何回する？','今月の食費を抑えるアイデアを募集','寝る前にスマホを見るのをやめたい'], 'パチンコ・スロット':['【雑談】昔のパチンコ台で好きだった演出','遊技台の音やデザインについて語ろう','最新の遊技機ニュースを語るスレ','ホールの設備で便利になったと思うもの'], '食べ物':['【画像】昭和の給食を振り返ってみよう','ラーメンに一番合うトッピングは？','家で作る最強の卵かけご飯','【議論】カレーは甘口か辛口か'], 'ファッション':['腕時計はデジタル派？アナログ派？','長く使えるスニーカーの選び方','今年買ってよかった冬物アイテム','古着で見つけたお気に入り'], 'アニメ':['歴代アニメの名シーンについて語ろう','初めて買ったアニメグッズを教えて','【議論】アニメは何話構成がちょうどいい？','心に残っているアニメの主題歌'], 'ゲーム':['昔のゲーム機の思い出を語る','【質問】一生遊べるゲームを1本選ぶなら？','レトロゲームの名作を教えて','協力プレイがおもしろい作品を募集'], '漫画':['【議論】好きな漫画の最終回は？','ドラゴンボールで一番好きな戦い','全巻そろえたくなる漫画を挙げて','子供の頃に読んでいた漫画雑誌'], 'スポーツ':['野球観戦で思い出に残る試合','サッカーのスタジアム観戦の魅力','【雑談】運動を続けるコツを教えて','好きなスポーツ漫画は？'], '株・投資':['【議論】長期投資で大事なこと','株価チャートってどこを見てる？','投資信託の積立を続ける工夫','企業の決算で注目する数字とは？'], '仮想通貨':['ビットコインの仕組みを語ろう','暗号資産の保管方法の基本','ブロックチェーンの活用事例','手数料を比較するときのポイント'], '政治・経済':['【議論】物価上昇と暮らしについて','地域経済を盛り上げるには？','税金の使い道をわかりやすく考える','選挙の情報をどこから得ている？']};const key='minna-demo-v3';let saved;try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{saved={}};let posts=Array.isArray(saved.posts)?saved.posts:[],comments=saved.comments||{},favorites=saved.favorites||{},likes=saved.likes||{};const now=Date.now();let id=0;for(let repeat=0;repeat<3;repeat++)for(const [cat,arr] of Object.entries(titles))for(let j=0;j<arr.length;j++){posts.some(p=>p.id==='d'+id)||posts.push({id:'d'+id,title:arr[j],cat,created:now-(id*430000+repeat*120000),views:Math.max(1,420-id*3),sample:true});id++}let sort='new',mode='all',page=1,query='';const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function store(){try{localStorage.setItem(key,JSON.stringify({posts:posts.filter(p=>!p.sample),comments,favorites,likes}))}catch{}}function score(p){return (p.views||0)+((comments[p.id]||[]).length*16)+(likes[p.id]?25:0)}function ordered(arr,by=sort){return [...arr].sort((a,b)=>by==='popular'?score(b)-score(a):b.created-a.created)}function visible(){let v=posts;if(mode==='fav')v=v.filter(p=>favorites[p.id]);if(query)v=v.filter(p=>(p.title+' '+p.cat).toLowerCase().includes(query.toLowerCase()));return ordered(v)}function item(p,compact=false){let li=document.createElement('li');li.className='article';li.innerHTML=`<button class="headline" title="${esc(p.title)}">${esc(p.title)}</button>${!compact?`<span class="tag ${score(p)>325?'hot':''}">${esc(p.cat)}</span><span class="meta">💬 ${(comments[p.id]||[]).length}</span><span class="source">${p.sample?'サンプル記事':'ユーザー投稿'}</span>`:''}`;li.querySelector('button').onclick=()=>openPost(p.id);return li}function render(){const v=visible(),per=30,total=Math.max(1,Math.ceil(v.length/per));page=Math.min(page,total);$('#feed').replaceChildren(...v.slice((page-1)*per,page*per).map(p=>item(p)));if(!v.length)$('#feed').innerHTML='<li class="empty">該当する記事がありません。</li>';$('#count').textContent=`（${v.length?((page-1)*per+1):0}件〜${Math.min(page*per,v.length)}件 / 全${v.length}件）`;$('#listTitle').textContent=mode==='fav'?'お気に入り記事':mode==='popular'?'急上昇記事':'新着記事';$('#sortNew').classList.toggle('selected',sort==='new');$('#sortPopular').classList.toggle('selected',sort==='popular');let pg=$('#pages');pg.innerHTML='';const b=(text,fn,active)=>{let x=document.createElement('button');x.textContent=text;x.classList.toggle('active',!!active);x.onclick=fn;pg.append(x)};b('ホーム',()=>{mode='all';sort='new';page=1;query='';$('#search').value='';render()});b('前のページ',()=>{page=Math.max(1,page-1);render();scrollTo(0,0)});for(let n=1;n<=Math.min(total,10);n++)b(n,()=>{page=n;render();scrollTo(0,0)},page===n);b('次のページ',()=>{page=Math.min(total,page+1);render();scrollTo(0,0)});b('人気記事ランキング',()=>{mode='popular';sort='popular';page=1;render()});document.querySelectorAll('.toplinks button').forEach(x=>x.classList.remove('active'));$('#nav'+(mode==='fav'?'Fav':mode==='popular'?'Rank':'Home')).classList.add('active');renderCats()}function renderCats(){const root=$('#sections');root.innerHTML='';cats.forEach((cat,i)=>{const panel=document.createElement('section');panel.className='panel';panel.innerHTML=`<div class="panelhead"><span>${['✎','◎','▣','▰','★','⌂','▥','♜','◆','▤','♟','▦','⚽','▤','◈','▧'][i]}</span><span>${esc(cat)}</span><span class="right"><button class="selected">新着</button><button>ランキング</button></span></div><ul class="articles"></ul>`;let catSort='new';function update(){panel.querySelector('ul').replaceChildren(...ordered(posts.filter(p=>p.cat===cat),catSort).slice(0,5).map(p=>item(p,true)));panel.querySelectorAll('.right button').forEach((b,k)=>b.classList.toggle('selected',k===(catSort==='new'?0:1)))}panel.querySelectorAll('.right button')[0].onclick=()=>{catSort='new';update()};panel.querySelectorAll('.right button')[1].onclick=()=>{catSort='popular';update()};update();root.append(panel)})}function close(){$('#overlay').classList.remove('open');document.body.style.overflow=''}function dialog(title,html){$('#dialogLabel').textContent=title;$('#dialogBody').innerHTML=html;$('#overlay').classList.add('open');document.body.style.overflow='hidden'}function openPost(pid){const p=posts.find(x=>x.id===pid);if(!p)return;let cs=comments[pid]||[];dialog('スレッド',`<div class="muted">${esc(p.cat)} · ${p.sample?'サンプル記事':'ユーザー投稿'} · コメント ${cs.length}件</div><h2 class="detailtitle">${esc(p.title)}</h2><p class="muted">${p.sample?'これは画面確認用の架空のスレッドです。外部ニュース記事へのリンクではありません。':'ユーザー作成スレッドです。'}</p><div class="controls"><button id="like">${likes[pid]?'♥ いいね済み':'♡ いいね'}</button><button id="fav">${favorites[pid]?'★ お気に入り解除':'☆ お気に入り'}</button><button id="share">リンクをコピー</button></div><h3>コメント（${cs.length}）</h3><div class="comments">${cs.map((c,i)=>`<div class="comment"><b>${i+1}. 名無しさん</b><p>${esc(c)}</p></div>`).join('')||'<p class="muted">まだコメントはありません。最初のコメントを投稿しよう。</p>'}</div><label class="field" for="commentInput">コメントする</label><textarea id="commentInput" maxlength="1000" placeholder="意見や感想を書いてください（1000文字以内）"></textarea><div class="controls"><button class="primary" id="sendComment">投稿する</button></div>`);$('#like').onclick=()=>{likes[pid]=!likes[pid];store();openPost(pid);render()};$('#fav').onclick=()=>{favorites[pid]=!favorites[pid];store();openPost(pid);render()};$('#share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href.split('#')[0]+'#thread='+encodeURIComponent(pid));$('#share').textContent='コピーしました'}catch{$('#share').textContent='コピーに失敗しました'}};$('#sendComment').onclick=()=>{const t=$('#commentInput').value.trim();if(!t)return alert('コメントを入力してください');(comments[pid]??=[]).push(t);store();openPost(pid);render()};if(location.hash!=='#thread='+pid)history.replaceState(null,'','#thread='+encodeURIComponent(pid))}function createPost(){dialog('新しいスレッドを作成',`<form id="createForm"><label class="field" for="postCategory">ジャンル</label><select id="postCategory">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><label class="field" for="postTitle">スレッドタイトル</label><input id="postTitle" required maxlength="100" placeholder="例：最近買ってよかったものを語ろう"><label class="field" for="postBody">最初のコメント（任意）</label><textarea id="postBody" maxlength="1000" placeholder="補足や質問など"></textarea><p class="muted">公開共有はされず、このブラウザだけに保存されます。個人情報や誹謗中傷の投稿は避けてください。</p><button class="primary" type="submit">スレッドを作成</button></form>`);$('#createForm').onsubmit=e=>{e.preventDefault();const title=$('#postTitle').value.trim();if(!title)return;let p={id:'u'+Date.now(),title,cat:$('#postCategory').value,created:Date.now(),views:0,sample:false};posts.push(p);let body=$('#postBody').value.trim();if(body)comments[p.id]=[body];store();mode='all';page=1;query='';$('#search').value='';render();openPost(p.id)}}$('#closeDialog').onclick=close;$('#overlay').onclick=e=>{if(e.target===$('#overlay'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});$('#navHome').onclick=()=>{mode='all';sort='new';page=1;render()};$('#navRank').onclick=()=>{mode='popular';sort='popular';page=1;render()};$('#navFav').onclick=()=>{mode='fav';page=1;render()};$('#navPost').onclick=createPost;$('#sortNew').onclick=()=>{sort='new';page=1;render()};$('#sortPopular').onclick=()=>{sort='popular';page=1;render()};$('#searchGo').onclick=()=>{query=$('#search').value.trim();page=1;render()};$('#search').onkeydown=e=>{if(e.key==='Enter')$('#searchGo').click()};render();let hash=decodeURIComponent(location.hash.replace('#thread=',''));if(location.hash.startsWith('#thread=')&&posts.some(p=>p.id===hash))openPost(hash)})();
</script><script>
(()=>{'use strict';
const root=document.getElementById('realNewsRows'), filters=document.getElementById('realFilters');
const heading=document.getElementById('realNewsHeading');
const note=document.querySelector('.realnews-note');
let items=[], selected='すべて',payload=null;
heading.innerHTML='📰 注目ニュース <small id="newsUpdated">自動更新・未取得</small>';
const toolbar=document.createElement('div'); toolbar.className='proofbar';
const refresh=document.createElement('button'); refresh.textContent='↻ 最新の取得データを確認';
const policy=document.createElement('button');policy.textContent='選定ルール・取得元を確認';
const status=document.createElement('span');status.setAttribute('role','status');status.textContent='ニュースデータを読み込み中…';
toolbar.append(refresh,policy,status);document.querySelector('.realnews-title').after(toolbar);
const dialog=document.createElement('dialog');dialog.className='rss-proof';document.body.append(dialog);
function close(){dialog.close()}
function showDialog(title,content){dialog.replaceChildren();let h=document.createElement('h3');h.textContent=title;dialog.append(h,content);let b=document.createElement('button');b.textContent='閉じる';b.onclick=close;dialog.append(b);dialog.showModal()}
function paragraph(t){const p=document.createElement('p');p.textContent=t;return p}
function fmt(d){if(!d)return '未取得';const date=new Date(d);return Number.isNaN(date.getTime())?'不明':date.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+' JST'}
function proof(x){let c=document.createElement('div');const r=x.reason||{};[
  '掲載理由：'+(r.scoring_rule||'現在の掲載基準に従った候補'),
  '注目候補スコア：'+x.score+'点（新しさ '+(r.freshness_points||0)+'点／媒体一致 '+(r.additional_source_points||0)+'点／NHK・BBCフィード '+(r.primary_feed_bonus||0)+'点）',
  '公開日時：'+fmt(x.published_at),'掲載データ更新：'+fmt(payload?.generated_at),
  '掲載元：'+x.source,'取得フィード：'+x.feed,
  '見出し一致を確認した媒体：'+(r.source_names||[x.source]).join('、'),
  '注意：これは実際のPVやSNS拡散数ではなく、RSSに基づく独自の候補順位です。同じ事件でも見出しが違えば別の記事として扱われます。'
].forEach(t=>c.append(paragraph(t)));let link=document.createElement('a');link.textContent='元の記事を開く ↗';link.href=x.url;link.target='_blank';link.rel='noopener noreferrer';c.append(link);showDialog('掲載の根拠',c)}
function render(){const cats=['すべて',...new Set(items.map(x=>x.category))];filters.replaceChildren(...cats.map(cat=>{let b=document.createElement('button');b.textContent=cat;b.className=selected===cat?'on':'';b.onclick=()=>{selected=cat;render()};return b}));root.replaceChildren();const found=items.filter(x=>selected==='すべて'||x.category===selected);
if(!found.length){root.append(paragraph(payload?.status==='not_started'?'最初のRSS更新がまだ実行されていません。READMEの初期設定をご確認ください。':'現在表示できるニュースがありません。更新状態を確認してください。'));return}
found.forEach(x=>{let row=document.createElement('div');row.className='real-row';let date=document.createElement('span');date.className='real-date';date.textContent=fmt(x.published_at).slice(5,16);let a=document.createElement('a');a.className='real-headline';a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=x.title;let cat=document.createElement('span');cat.className='real-cat';cat.textContent=x.category;let src=document.createElement('span');src.className='real-source';src.textContent=x.source;let why=document.createElement('button');why.className='reasonbtn';why.textContent='根拠 '+x.score+'点';why.onclick=()=>proof(x);row.append(date,a,cat,src,why);root.append(row)})}
policy.onclick=()=>{let c=document.createElement('div');c.append(paragraph(payload?.method||'RSSの更新をまだ実行していません。'));c.append(paragraph('掲載順：72時間以内の公開記事を対象に、新しさ、見出しが一致する異なる媒体数、NHK/BBCのフィードから取得されたかで採点。ジャンルごと最大10件、全体最大60件です。実測の話題度を示すものではありません。'));c.append(paragraph('正常取得：'+(payload?.feed_success||[]).length+'フィード／エラー：'+(payload?.feed_errors||[]).length+'フィード'));(payload?.feed_success||[]).forEach(f=>{let p=paragraph(f.name+'：'+f.count+'件 ／ '+f.url);c.append(p)});(payload?.feed_errors||[]).forEach(e=>c.append(paragraph('取得失敗：'+e.feed+'：'+e.error)));showDialog('更新根拠と取得元',c)};
async function load(){status.textContent='データ取得中…';try{let res=await fetch('./data/news.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);payload=await res.json();items=Array.isArray(payload.articles)?payload.articles:[];document.getElementById('newsUpdated').textContent='最終成功取得：'+fmt(payload.generated_at);status.textContent='表示 '+items.length+'件 ／ '+(payload.status==='ok'?'正常':payload.status==='partial'?'一部取得失敗':payload.status==='error'?'取得失敗・過去データ':'未実行');note.textContent='RSSを3時間ごとに更新する設定です（GitHub Actionsを有効化・GitHub Pages等に公開した場合）。PV・SNS拡散数は測定していません。各記事の「根拠」でスコア内訳を表示できます。';render()}catch(e){items=[];root.replaceChildren(paragraph('自動ニュースはWebサーバーで開く必要があります。ローカルのHTML直開き（file://）ではJSONを読み込めない場合があります。公開設定とREADMEを確認してください。'));status.textContent='読み込み失敗：'+e.message;}}
refresh.onclick=load;load();
})();
</script></body></html>
