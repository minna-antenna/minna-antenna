name: Update news RSS
on:
  workflow_dispatch:
  schedule:
    - cron: '7 */3 * * *'
permissions:
  contents: write
concurrency:
  group: site-content-update
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Refresh feed index
        id: rss
        continue-on-error: true
        run: python scripts/update_news.py
      - name: Commit updated JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          if ! git diff --cached --quiet; then git commit -m 'chore: refresh news RSS'; git push; fi
      - name: Report RSS failure after preserving diagnostic snapshot
        if: steps.rss.outcome == 'failure'
        run: exit 1
