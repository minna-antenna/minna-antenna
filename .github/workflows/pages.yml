name: Deploy GitHub Pages
on:
  workflow_run:
    workflows: ['Build article index and sitemap']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  package:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    steps:
      - name: Require GitHub Actions and the configured custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$source_type" != "workflow" ]; then
            echo '::error::Pages Source must be GitHub Actions before deploying. Existing branch publishing has been left unchanged.'
            exit 1
          fi
          custom_domain=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.cname // ""')
          if [ "$custom_domain" != "topic-kichi.com" ]; then
            echo '::error::Pages Custom domain must remain topic-kichi.com. No domain setting was changed.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - name: Stage public files only
        run: |
          rm -rf _site
          mkdir -p _site/articles
          cp index.html about.html privacy.html contact.html sitemap.xml robots.txt ads.txt googleb899a57e1737e8bb.html _site/
          cp -R articles/. _site/articles/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: package
    if: needs.package.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact to be discoverable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and (.expired | not))] | length'); then
              if [ "$count" -eq 1 ]; then
                echo "Pages artifact is visible; allow metadata propagation before deploy."
                sleep 20
                exit 0
              fi
              if [ "$count" -gt 1 ]; then
                echo "::error::Multiple github-pages artifacts are present; aborting."
                exit 1
              fi
            fi
            echo "Pages artifact not visible yet (attempt $attempt/12)."
            sleep 10
          done
          echo "::error::Timed out waiting for the github-pages artifact to become visible."
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
