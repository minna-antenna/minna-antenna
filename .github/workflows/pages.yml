name: Deploy GitHub Pages
on:
  workflow_run:
    workflows: ['Build article index and sitemap', 'Update news RSS']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require GitHub Actions as Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$source_type" != "workflow" ]; then
            echo '::error::Pages Source must be GitHub Actions before deploying. Existing branch publishing has been left unchanged.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - name: Stage public files only
        run: |
          mkdir -p _site/articles _site/data
          cp index.html about.html privacy.html contact.html sitemap.xml robots.txt googleb899a57e1737e8bb.html _site/
          cp -R articles/. _site/articles/
          cp data/news.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
